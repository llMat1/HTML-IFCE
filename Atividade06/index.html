<!DOCTYPE html>
<html>
    <head>
        <title>Atividade 6.2</title>
    </head>
    <body>
        <p>Lista ordenada:</p>
        <ol type="1">
            <li>Item 1</li>
            <li>Item 2</li>
        </ol>
        <ol type="a" start="3">
            <li>Item 1</li>
            <li>Item 2</li>
        </ol>
        <ol type="A" start="5">
            <li>Item 1</li>
            <li>Item 2</li>
        </ol>
        <ol type="i" reversed>
            <li>Item 1</li>
            <li>Item 2</li>
        </ol>
        <ol type="I" reversed>
            <li>Item 1</li>
            <li>Item 2</li>
        </ol>
    </body>
</html>
