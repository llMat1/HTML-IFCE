<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <title>Cadastro de Usuário</title>
    </head>
    <body>
        <header>
            <h1>Cadastro de Usuário</h1>
            <nav>
                <a href="#cadastro">Cadastro</a>
            </nav>
        </header>
        <main>
            <section id="cadastro">
                <h2>Crie sua conta</h2>
                <form>
                    <label for="nome">
                        Nome:
                    </label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                    >
                    <br><br>
                    <label for="email">
                        E-mail:
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                    <br><br>
                    <label for="senha">
                        Senha:
                    </label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required
                    >
                    <br><br>
                    <label for="genero">
                        Gênero:
                    </label>
                    <select id="genero" name="genero">
                        <option value="">
                            Selecione
                        </option>
                        <option value="masculino">
                            Masculino
                        </option>
                        <option value="feminino">
                            Feminino
                        </option>
                        <option value="outro">
                            Outro
                        </option>
                        <option value="nao-informar">
                            Prefiro não informar
                        </option>
                    </select>
                    <br><br>
                    <p>Interesses:</p>
                    <input
                        type="checkbox"
                        id="programacao"
                        name="interesses"
                        value="programacao"
                    >
                    <label for="programacao">
                        Programação
                    </label>
                    <br>
                    <input
                        type="checkbox"
                        id="tecnologia"
                        name="interesses"
                        value="tecnologia"
                    >
                    <label for="tecnologia">
                        Tecnologia
                    </label>
                    <br>
                    <input
                        type="checkbox"
                        id="jogos"
                        name="interesses"
                        value="jogos"
                    >
                    <label for="jogos">
                        Jogos
                    </label>
                    <br>
                    <input
                        type="checkbox"
                        id="musica"
                        name="interesses"
                        value="musica"
                    >
                    <label for="musica">
                        Música
                    </label>
                    <br><br>
                    <label for="biografia">
                        Breve biografia:
                    </label>
                    <br>
                    <textarea
                        id="biografia"
                        name="biografia"
                        rows="6"
                        cols="40"
                        placeholder="Conte um pouco sobre você..."
                    ></textarea>
                    <br><br>
                    <input
                        type="submit"
                        value="Cadastrar"
                    >
                    <input
                        type="reset"
                        value="Limpar"
                    >
                </form>
            </section>
        </main>
        <footer>
            <p>- Cadastro de Usuário -</p>
        </footer>
    </body>
</html>
